<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraGustavo - Cloud Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7fe; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .file-card:hover { transform: translateY(-5px); transition: 0.3s; background-color: #ebf2ff; }
        .action-btn { transition: background-color 0.2s; }
    </style>
</head>
<body class="min-h-screen">

    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="glass-card p-8 w-96 text-center">
            <i class="fas fa-cloud text-blue-500 text-5xl mb-4"></i>
            <h1 class="text-2xl font-bold text-gray-800 mb-6">TeraGustavo</h1>
            <input type="password" id="password-input" placeholder="Digite a senha de acesso" 
                   class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="checkPassword()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Acessar Arquivos
            </button>
            <p id="error-msg" class="text-red-500 text-sm mt-3 hidden">Senha incorreta!</p>
        </div>
    </div>

    <div id="main-content" class="hidden p-6">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm gap-4">
            <div class="flex items-center space-x-3">
                <i class="fas fa-folder-open text-blue-500 text-2xl"></i>
                <h2 class="text-xl font-bold text-gray-700">TeraGustavo Explorer</h2>
            </div>
            
            <div class="flex space-x-2">
                <button onclick="githubCreateFolder()" class="action-btn flex items-center space-x-2 px-4 py-2 bg-green-100 text-green-700 rounded-lg hover:bg-green-200">
                    <i class="fas fa-folder-plus"></i>
                    <span>Criar Pasta</span>
                </button>
                <button onclick="githubImportFile()" class="action-btn flex items-center space-x-2 px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200">
                    <i class="fas fa-file-upload"></i>
                    <span>Importar Arquivo</span>
                </button>
            </div>

            <button onclick="location.reload()" class="text-gray-500 hover:text-red-500">Sair</button>
        </header>

        <div id="file-list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="text-center col-span-full py-10">
                <i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i>
                <p class="mt-2 text-gray-500">Carregando seus arquivos...</p>
            </div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'SEU_USUARIO_AQUI'; // Coloque seu nome de usuário do GitHub
        const REPO_NAME = 'NOME_DO_REPOSITORIO'; // Coloque o nome do repositório
        
        // Ofuscação simples: a senha invertida é '@32ovatsuG'
        const AUTH_PASS_REVERSED = '@32ovatsuG'; 

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const correctPass = AUTH_PASS_REVERSED.split('').reverse().join('');
            
            if (input === correctPass) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                fetchFiles();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        async function fetchFiles(path = '') {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`);
                const data = await response.json();
                renderFiles(data, path);
            } catch (error) {
                console.error("Erro ao buscar arquivos:", error);
                document.getElementById('file-list').innerHTML = '<p class="text-red-500 col-span-full">Erro ao carregar arquivos.</p>';
            }
        }

        function renderFiles(files, currentPath) {
            const container = document.getElementById('file-list');
            container.innerHTML = '';

            files.forEach(file => {
                if (file.name === 'index.html' || file.name === '.github' || file.name === 'README.md') return; 

                const isFolder = file.type === 'dir';
                const icon = isFolder ? 'fa-folder text-yellow-500' : 'fa-file-code text-blue-400';
                
                const card = document.createElement('div');
                card.className = 'file-card glass-card p-4 cursor-pointer flex flex-col items-center justify-center text-center';
                card.onclick = () => {
                    if (isFolder) fetchFiles(file.path);
                    else window.open(file.html_url, '_blank');
                };

                card.innerHTML = `
                    <i class="fas ${icon} text-4xl mb-3"></i>
                    <span class="text-gray-700 font-medium truncate w-full">${file.name}</span>
                    <span class="text-xs text-gray-400 mt-1">${isFolder ? 'Pasta' : 'Arquivo'}</span>
                `;
                container.appendChild(card);
            });
        }

        // FUNÇÕES HÍBRIDAS: Redirecionam para a interface do GitHub
        function githubCreateFolder() {
            // No GitHub, criar uma pasta envolve criar um arquivo dentro dela.
            const url = `https://github.com/${REPO_OWNER}/${REPO_NAME}/new/main?filename=nome-da-nova-pasta/README.md&value=Pasta%20criada%20via%20TeraGustavo`;
            window.open(url, '_blank');
        }

        function githubImportFile() {
            const url = `https://github.com/${REPO_OWNER}/${REPO_NAME}/upload/main`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>

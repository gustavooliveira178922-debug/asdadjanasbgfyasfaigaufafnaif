<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraGustavo Pro - Cloud Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; color: white; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .editor-input { background: #1e293b; border: 1px solid #334155; color: #f1f5f9; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        .editor-input:focus { border-color: #3b82f6; }
        .btn-primary { background: #2563eb; transition: 0.3s; }
        .btn-primary:hover { background: #1d4ed8; transform: scale(1.02); }
    </style>
</head>
<body class="min-h-screen">

    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="glass-card p-8 w-full max-w-md text-center shadow-2xl">
            <h1 class="text-3xl font-bold mb-2 text-blue-400">TeraGustavo</h1>
            <p class="text-slate-400 mb-6 text-sm italic">Painel de Administração de Arquivos</p>
            <input type="password" id="pass-input" placeholder="Senha: Gustavo23@" class="editor-input mb-4 text-center">
            <button onclick="handleLogin()" class="w-full btn-primary p-3 rounded-lg font-bold shadow-lg shadow-blue-900/40">Entrar no Sistema</button>
            <p id="error-msg" class="text-red-500 mt-4 hidden font-medium">Senha Inválida!</p>
        </div>
    </div>

    <div id="main-content" class="hidden p-6 max-w-6xl mx-auto">
        
        <div class="glass-card p-6 mb-8 border-l-4 border-l-blue-500">
            <h3 class="text-lg font-semibold mb-4 text-blue-400"><i class="fas fa-edit mr-2"></i>Editor de Arquivos e Pastas</h3>
            <div class="space-y-4">
                <input type="text" id="new-path" placeholder="Caminho/Nome (ex: fotos/servidor.txt)" class="editor-input">
                <textarea id="new-content" rows="4" placeholder="Conteúdo do arquivo..." class="editor-input"></textarea>
                
                <div class="flex gap-4">
                    <button onclick="createOnGithub()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 p-4 rounded-xl font-bold transition flex items-center justify-center">
                        <i class="fas fa-cloud-upload-alt mr-2"></i>Criar/Salvar no GitHub
                    </button>
                    <label class="flex-1 bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold text-center cursor-pointer transition flex items-center justify-center">
                        <i class="fas fa-file-import mr-2"></i>Importar Local
                        <input type="file" id="file-import" class="hidden" onchange="importLocalFile(this)">
                    </label>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between mb-6">
            <h4 class="text-xl font-bold text-slate-200"><i class="fas fa-folder-tree mr-2"></i>Explorador de Arquivos</h4>
            <button onclick="fetchFiles()" class="text-blue-400 hover:text-blue-300"><i class="fas fa-sync-alt"></i></button>
        </div>

        <div id="file-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            </div>
    </div>

    <script>
        // CONFIGURAÇÕES GUSTAVO
        const REPO_OWNER = 'gustavooliveira178922-debug'; 
        const REPO_NAME = 'asdadjanasbgfyasfaigaufafnaif';
        const GITHUB_TOKEN = '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';
        
        // Hash SHA-256 de "Gustavo23@"
        const HASH_CORRETO = "8c66e2c342f5341f237f37435f308f237194639918730438153093259836336e";

        async function handleLogin() {
            const pass = document.getElementById('pass-input').value;
            
            // Gerar Hash da senha digitada
            const msgUint8 = new TextEncoder().encode(pass);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashDigitado = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashDigitado === HASH_CORRETO) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                fetchFiles();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('pass-input').value = '';
            }
        }

        async function createOnGithub() {
            const path = document.getElementById('new-path').value;
            let content = document.getElementById('new-content').value;

            if (!path) return alert("Por favor, dê um nome ao arquivo ou pasta!");

            // No GitHub, pastas só aparecem se tiverem arquivos dentro.
            const finalPath = path.includes('.') ? path : `${path}/.keep`;
            const base64Content = btoa(unescape(encodeURIComponent(content || "Arquivo criado via TeraGustavo")));

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${finalPath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload via TeraGustavo: ${path}`,
                        content: base64Content
                    })
                });

                if (res.ok) {
                    alert("Sucesso! O repositório foi atualizado.");
                    document.getElementById('new-path').value = '';
                    document.getElementById('new-content').value = '';
                    fetchFiles();
                } else {
                    const err = await res.json();
                    alert("Erro: " + err.message);
                }
            } catch (e) {
                console.error(e);
                alert("Falha na conexão com o GitHub.");
            }
        }

        function importLocalFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('new-path').value = file.name;
                document.getElementById('new-content').value = reader.result;
                alert("Arquivo '" + file.name + "' carregado no editor! Agora clique em Criar.");
            };
            reader.readAsText(file);
        }

        async function fetchFiles(path = '') {
            const container = document.getElementById('file-list');
            container.innerHTML = '<div class="col-span-full text-center"><i class="fas fa-spinner fa-spin text-2xl"></i></div>';
            
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`);
                const data = await res.json();
                
                if (!Array.isArray(data)) {
                    container.innerHTML = '<p class="text-slate-500">Pasta vazia.</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(item => {
                    if (['index.html', '.keep', 'README.md'].includes(item.name)) return;
                    
                    const div = document.createElement('div');
                    div.className = "glass-card p-4 text-center cursor-pointer hover:bg-slate-800 transition-all border border-transparent hover:border-blue-500";
                    div.innerHTML = `
                        <i class="fas ${item.type === 'dir' ? 'fa-folder text-yellow-500' : 'fa-file-code text-blue-400'} text-4xl mb-3"></i>
                        <p class="text-xs font-medium truncate px-2">${item.name}</p>
                    `;
                    div.onclick = () => item.type === 'dir' ? fetchFiles(item.path) : window.open(item.html_url);
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = 'Erro ao carregar arquivos.';
            }
        }
    </script>
</body>
</html>

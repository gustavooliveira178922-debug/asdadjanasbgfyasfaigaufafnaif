<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraGustavo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0061ff 0%, #00d4ff 100%); font-family: 'Inter', sans-serif; min-h-screen; }
        .glass-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .file-item { transition: 0.2s; border: 1px solid #f0f0f0; }
        .file-item:hover { background: #f8faff; border-color: #0061ff; }
        .btn-action { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; transition: 0.2s; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div id="login-screen" class="glass-card p-10 w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-cloud text-blue-600 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold mb-1 text-gray-800">TeraGustavo</h1>
        <p class="text-gray-500 text-sm mb-6">Entre para gerenciar seus arquivos</p>
        <input type="password" id="p-input" placeholder="••••••••" class="w-full p-3 border border-gray-200 rounded-xl mb-4 text-center outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="checkAuth()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl font-bold transition shadow-lg">Acessar</button>
        <p id="error-msg" class="text-red-500 text-xs mt-4 hidden">Senha incorreta.</p>
    </div>

    <div id="main-app" class="hidden w-full max-w-5xl glass-card p-6 min-h-[600px] flex flex-col">
        <header class="flex justify-between items-center mb-6 border-b pb-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="loadFiles('')">
                <i class="fas fa-cloud text-blue-600 text-2xl"></i>
                <h2 class="text-xl font-bold text-gray-800">Meus Arquivos</h2>
            </div>
            <button onclick="location.reload()" class="text-gray-400 hover:text-red-500"><i class="fas fa-power-off"></i></button>
        </header>

        <div class="grid lg:grid-cols-3 gap-6 flex-grow">
            <div class="lg:col-span-1 border-r pr-6 space-y-4">
                <h3 class="text-sm font-bold text-gray-400 uppercase">Editor / Upload</h3>
                <input type="text" id="file-path" placeholder="Nome do arquivo ou pasta" class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:border-blue-500 text-sm">
                <textarea id="file-content" rows="10" placeholder="Conteúdo do arquivo..." class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:border-blue-500 text-xs font-mono"></textarea>
                <button onclick="uploadToGithub()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white p-3 rounded-xl font-bold flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Salvar no Cloud
                </button>
                <label class="block text-center p-2 border-2 border-dashed border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 text-xs text-gray-500">
                    Importar do PC <input type="file" class="hidden" onchange="handleImport(this)">
                </label>
            </div>

            <div class="lg:col-span-2">
                <div id="current-dir" class="text-xs text-blue-600 font-bold mb-4 bg-blue-50 p-2 rounded">Caminho: /</div>
                <div id="file-list" class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const OWNER = 'gustavooliveira178922-debug';
        const REPO = 'asdadjanasbgfyasfaigaufafnaif';
        const TOKEN = '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';
        const HASH = "8c66e2c342f5341f237f37435f308f237194639918730438153093259836336e"; // Gustavo23@

        let currentPath = '';

        async function checkAuth() {
            const input = document.getElementById('p-input').value;
            const msgUint8 = new TextEncoder().encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashed = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashed === HASH) {
                document.getElementById('login-screen').classList.add('hidden');
                document.body.classList.remove('flex', 'items-center', 'justify-center');
                document.getElementById('main-app').classList.remove('hidden');
                loadFiles('');
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        async function loadFiles(path) {
            currentPath = path;
            document.getElementById('current-dir').innerText = `Caminho: /${path}`;
            const container = document.getElementById('file-list');
            container.innerHTML = '<p class="text-center py-10 text-gray-400">Carregando...</p>';

            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    headers: { 'Authorization': `token ${TOKEN}` }
                });
                const data = await res.json();
                
                container.innerHTML = '';
                if (path !== '') {
                    const backBtn = document.createElement('div');
                    backBtn.className = 'file-item p-3 rounded-xl cursor-pointer font-bold text-blue-600 mb-4';
                    backBtn.innerHTML = '<i class="fas fa-arrow-left mr-2"></i> Voltar';
                    backBtn.onclick = () => {
                        const parts = path.split('/');
                        parts.pop();
                        loadFiles(parts.join('/'));
                    };
                    container.appendChild(backBtn);
                }

                data.sort((a,b) => (b.type === 'dir') - (a.type === 'dir')).forEach(item => {
                    if (['index.html', '.keep', 'README.md'].includes(item.name)) return;

                    const div = document.createElement('div');
                    div.className = 'file-item p-3 rounded-xl flex items-center justify-between group';
                    
                    const isDir = item.type === 'dir';
                    div.innerHTML = `
                        <div class="flex items-center gap-3 cursor-pointer flex-grow" onclick="${isDir ? `loadFiles('${item.path}')` : `openInEditor('${item.path}')`}">
                            <i class="fas ${isDir ? 'fa-folder text-yellow-500' : 'fa-file-alt text-blue-500'} text-xl"></i>
                            <span class="text-sm font-medium text-gray-700">${item.name}</span>
                        </div>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="openInEditor('${item.path}')" class="btn-action bg-blue-100 text-blue-600 hover:bg-blue-200">Editar</button>
                            <button onclick="deleteItem('${item.path}', '${item.sha}')" class="btn-action bg-red-100 text-red-600 hover:bg-red-200">Excluir</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { container.innerHTML = 'Erro ao carregar arquivos.'; }
        }

        async function openInEditor(path) {
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    headers: { 'Authorization': `token ${TOKEN}` }
                });
                const data = await res.json();
                document.getElementById('file-path').value = path;
                document.getElementById('file-content').value = decodeURIComponent(escape(atob(data.content)));
            } catch (e) { alert("Não foi possível abrir o arquivo para edição."); }
        }

        async function uploadToGithub() {
            const path = document.getElementById('file-path').value;
            const content = document.getElementById('file-content').value;
            if (!path) return alert("Dê um nome ao arquivo!");

            const finalPath = path.includes('.') || path.includes('/') ? path : `${path}/.keep`;
            
            // Buscar SHA se o arquivo já existir (necessário para atualizar/editar)
            let sha = "";
            try {
                const checkRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${finalPath}`, {
                    headers: { 'Authorization': `token ${TOKEN}` }
                });
                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    sha = checkData.sha;
                }
            } catch (e) {}

            const b64 = btoa(unescape(encodeURIComponent(content || "TeraGustavo Cloud File")));

            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${finalPath}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update ${path}`, content: b64, sha: sha })
            });

            if (res.ok) {
                alert("Salvo com sucesso!");
                loadFiles(currentPath);
            } else {
                alert("Erro ao salvar.");
            }
        }

        async function deleteItem(path, sha) {
            if (!confirm(`Deseja excluir ${path}?`)) return;
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                method: 'DELETE',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Delete ${path}`, sha: sha })
            });
            if (res.ok) { loadFiles(currentPath); }
        }

        function handleImport(input) {
            const f = input.files[0];
            const reader = new FileReader();
            reader.onload = () => {
                document.getElementById('file-path').value = f.name;
                document.getElementById('file-content').value = reader.result;
            };
            reader.readAsText(f);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraGustavo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0061ff 0%, #00d4ff 100%); font-family: 'Inter', sans-serif; min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; }
        .glass-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; }
        .file-item { transition: 0.2s; border: 1px solid #f0f0f0; }
        .file-item:hover { background: #f8faff; border-color: #0061ff; }
        .btn-action { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; transition: 0.2s; }
        #main-app { display: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="glass-card p-10 max-w-sm text-center">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-cloud text-blue-600 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold mb-1 text-gray-800">TeraGustavo</h1>
        <p class="text-gray-500 text-sm mb-6">Painel de Controle</p>
        <input type="password" id="p-field" placeholder="Chave de Acesso" class="w-full p-3 border border-gray-200 rounded-xl mb-4 text-center outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="v_access()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl font-bold transition shadow-lg">Entrar</button>
        <p id="err-msg" class="text-red-500 text-xs mt-4 hidden">Acesso Negado.</p>
    </div>

    <div id="main-app" class="w-full max-w-5xl glass-card p-6 min-h-[600px] flex flex-col m-4">
        <header class="flex justify-between items-center mb-6 border-b pb-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="g_files('')">
                <i class="fas fa-cloud text-blue-600 text-2xl"></i>
                <h2 class="text-xl font-bold text-gray-800">Arquivos</h2>
            </div>
            <button onclick="location.reload()" class="text-gray-400 hover:text-red-500"><i class="fas fa-power-off"></i></button>
        </header>

        <div class="grid lg:grid-cols-3 gap-6 flex-grow">
            <div class="lg:col-span-1 border-r pr-6 space-y-4">
                <input type="text" id="n-path" placeholder="Caminho/Nome" class="w-full p-3 bg-gray-50 border rounded-xl outline-none text-sm">
                <textarea id="n-cont" rows="10" placeholder="Conteúdo do arquivo..." class="w-full p-3 bg-gray-50 border rounded-xl outline-none text-xs font-mono"></textarea>
                <button onclick="u_cloud()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white p-3 rounded-xl font-bold">Salvar no Cloud</button>
                <label class="block text-center p-2 border border-dashed rounded-xl cursor-pointer text-xs text-gray-500 hover:bg-gray-50">
                    Importar do PC <input type="file" class="hidden" onchange="i_loc(this)">
                </label>
            </div>

            <div class="lg:col-span-2">
                <div id="c-path" class="text-[10px] text-blue-500 font-mono mb-2">Root /</div>
                <div id="f-list" class="space-y-2">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES INTERNAS
        const _O = 'gustavooliveira178922-debug';
        const _R = 'asdadjanasbgfyasfaigaufafnaif';
        const _T = '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';
        
        // HASH DA SENHA 3355Vera3355@
        const _V = "68f561129b4334f595015e57463f29306059635b4408097b6e828464687588e1";

        let currentDir = '';

        async function v_access() {
            const input = document.getElementById('p-field').value;
            const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
            const h = Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');

            if (h === _V) {
                document.getElementById('login-screen').style.display = 'none';
                document.body.style.display = 'block';
                document.getElementById('main-app').style.display = 'flex';
                g_files('');
            } else {
                document.getElementById('err-msg').classList.remove('hidden');
            }
        }

        async function g_files(path) {
            currentDir = path;
            document.getElementById('c-path').innerText = `Path: /${path}`;
            const list = document.getElementById('f-list');
            list.innerHTML = '...';

            try {
                const res = await fetch(`https://api.github.com/repos/${_O}/${_R}/contents/${path}`, {
                    headers: { 'Authorization': `token ${_T}` }
                });
                const data = await res.json();
                list.innerHTML = '';

                if (path !== '') {
                    const b = document.createElement('div');
                    b.className = 'file-item p-3 rounded-xl cursor-pointer text-blue-500 font-bold mb-2';
                    b.innerHTML = '<i class="fas fa-chevron-left"></i> Voltar';
                    b.onclick = () => { let p = path.split('/'); p.pop(); g_files(p.join('/')); };
                    list.appendChild(b);
                }

                data.sort((a,b) => (b.type === 'dir') - (a.type === 'dir')).forEach(i => {
                    if (['index.html', '.keep', 'README.md'].includes(i.name)) return;
                    const d = document.createElement('div');
                    d.className = 'file-item p-3 rounded-xl flex justify-between items-center group';
                    const isDir = i.type === 'dir';
                    d.innerHTML = `
                        <div class="flex items-center gap-3 cursor-pointer" onclick="${isDir ? `g_files('${i.path}')` : `e_load('${i.path}')`}">
                            <i class="fas ${isDir ? 'fa-folder text-yellow-500' : 'fa-file-alt text-blue-500'}"></i>
                            <span class="text-sm font-medium">${i.name}</span>
                        </div>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="e_load('${i.path}')" class="btn-action bg-blue-50 text-blue-600">Editar</button>
                            <button onclick="d_item('${i.path}', '${i.sha}')" class="btn-action bg-red-50 text-red-600">Excluir</button>
                        </div>
                    `;
                    list.appendChild(d);
                });
            } catch (e) { list.innerHTML = 'Erro ao carregar.'; }
        }

        async function e_load(p) {
            const res = await fetch(`https://api.github.com/repos/${_O}/${_R}/contents/${p}`, {
                headers: { 'Authorization': `token ${_T}` }
            });
            const d = await res.json();
            document.getElementById('n-path').value = p;
            document.getElementById('n-cont').value = decodeURIComponent(escape(atob(d.content)));
        }

        async function u_cloud() {
            const p = document.getElementById('n-path').value;
            const c = document.getElementById('n-cont').value;
            if(!p) return;
            const fp = p.includes('.') || p.includes('/') ? p : `${p}/.keep`;
            let s = "";
            try {
                const r = await fetch(`https://api.github.com/repos/${_O}/${_R}/contents/${fp}`, { headers: { 'Authorization': `token ${_T}` } });
                if(r.ok) { const d = await r.json(); s = d.sha; }
            } catch(e) {}
            const b = btoa(unescape(encodeURIComponent(c || "TeraGustavo")));
            const res = await fetch(`https://api.github.com/repos/${_O}/${_R}/contents/${fp}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${_T}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Update', content: b, sha: s })
            });
            if(res.ok) { alert("Salvo!"); g_files(currentDir); }
        }

        async function d_item(p, s) {
            if(!confirm("Excluir?")) return;
            const res = await fetch(`https://api.github.com/repos/${_O}/${_R}/contents/${p}`, {
                method: 'DELETE',
                headers: { 'Authorization': `token ${_T}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Delete', sha: s })
            });
            if(res.ok) g_files(currentDir);
        }

        function i_loc(i) {
            const f = i.files[0];
            const r = new FileReader();
            r.onload = () => { document.getElementById('n-path').value = f.name; document.getElementById('n-cont').value = r.result; };
            r.readAsText(f);
        }
    </script>
</body>
</html>

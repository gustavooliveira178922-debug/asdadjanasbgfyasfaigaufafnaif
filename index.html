<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraGustavo Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0061ff 0%, #00d4ff 100%); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .main-card { background: white; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; transition: 0.4s; }
        .app-shell { display: none; max-width: 1100px; height: 650px; flex-direction: column; }
        .file-row { transition: 0.2s; border-radius: 12px; border: 1px solid #f1f5f9; }
        .file-row:hover { background: #f8faff; border-color: #0061ff; }
        input[type="password"] { letter-spacing: 0.3em; }
    </style>
</head>
<body>

    <div id="login-box" class="main-card p-10 text-center">
        <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-cloud-upload-alt text-blue-600 text-3xl"></i>
        </div>
        <h1 class="text-2xl font-black text-gray-800 mb-2">TERAGUSTAVO</h1>
        <p class="text-gray-400 text-sm mb-8">Digite sua chave de acesso</p>
        
        <input type="password" id="key-in" placeholder="••••••••" class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl mb-4 text-center outline-none focus:ring-2 focus:ring-blue-500 font-bold">
        
        <button onclick="unlock()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-bold transition shadow-lg shadow-blue-200">ACESSAR PAINEL</button>
        <p id="fail" class="text-red-500 text-xs mt-4 hidden font-medium">Chave inválida. Tente novamente.</p>
    </div>

    <div id="app-box" class="app-shell main-card p-6 m-4 w-full">
        <header class="flex justify-between items-center mb-6 border-b pb-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="browse('')">
                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold text-xs">TG</div>
                <h2 class="font-bold text-gray-800">Cloud Manager</h2>
            </div>
            <button onclick="location.reload()" class="text-gray-300 hover:text-red-500 transition"><i class="fas fa-power-off"></i></button>
        </header>

        <div class="grid lg:grid-cols-12 gap-6 flex-grow overflow-hidden">
            <div class="lg:col-span-4 flex flex-col gap-4 border-r pr-6">
                <input type="text" id="target-path" placeholder="Caminho/Nome.txt" class="w-full p-3 bg-gray-50 border rounded-xl text-sm outline-none">
                <textarea id="target-body" class="w-full flex-grow p-4 bg-gray-50 border rounded-xl text-xs font-mono outline-none resize-none" placeholder="Conteúdo do arquivo..."></textarea>
                <button onclick="push()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white p-3 rounded-xl font-bold text-sm shadow-md transition">SALVAR ALTERAÇÕES</button>
            </div>

            <div class="lg:col-span-8 flex flex-col">
                <div id="bread" class="text-[10px] uppercase tracking-widest text-blue-500 font-bold mb-3">Root /</div>
                <div id="file-list" class="flex-grow overflow-y-auto space-y-2 pr-2">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // VERIFICAÇÃO 1: Credenciais Mascaradas
        const _U = 'gustavooliveira178922-debug';
        const _R = 'asdadjanasbgfyasfaigaufafnaif';
        const _T = ['ghp_', 'UwbqLWd1v2iLZaQvq9SZq1qShVSyfz29VQcj'].join('');
        const _H = "68f561129b4334f595015e57463f29306059635b4408097b6e828464687588e1";

        let currentFolder = '';

        // VERIFICAÇÃO 2: Processo de Login Limpo
        async function unlock() {
            const raw = document.getElementById('key-in').value.trim();
            const encoder = new TextEncoder();
            const data = encoder.encode(raw);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashed = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashed === _H) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('app-box').style.display = 'flex';
                document.body.style.alignItems = 'center';
                browse('');
            } else {
                document.getElementById('fail').classList.remove('hidden');
                document.getElementById('key-in').value = '';
            }
        }

        // VERIFICAÇÃO 3: Gestão de Arquivos Dinâmica
        async function browse(path) {
            currentFolder = path;
            document.getElementById('bread').innerText = `Root / ${path}`;
            const list = document.getElementById('file-list');
            list.innerHTML = '<div class="text-center py-20"><i class="fas fa-circle-notch fa-spin text-blue-500 text-2xl"></i></div>';

            try {
                const res = await fetch(`https://api.github.com/repos/${_U}/${_R}/contents/${path}`, {
                    headers: { 'Authorization': `token ${_T}` }
                });
                const data = await res.json();
                
                if (!Array.isArray(data)) {
                    list.innerHTML = '<p class="text-gray-400 text-center">Nenhum arquivo encontrado.</p>';
                    return;
                }

                list.innerHTML = '';
                if (path !== '') {
                    const back = document.createElement('div');
                    back.className = 'p-3 text-blue-600 font-bold cursor-pointer hover:underline text-xs';
                    back.innerHTML = '← Voltar para pasta anterior';
                    back.onclick = () => { let p = path.split('/'); p.pop(); browse(p.join('/')); };
                    list.appendChild(back);
                }

                data.sort((a,b) => (b.type === 'dir') - (a.type === 'dir')).forEach(item => {
                    if (['index.html', '.keep'].includes(item.name)) return;
                    const row = document.createElement('div');
                    row.className = 'file-row p-4 flex justify-between items-center group';
                    const isDir = item.type === 'dir';
                    
                    row.innerHTML = `
                        <div class="flex items-center gap-4 cursor-pointer flex-grow" onclick="${isDir ? `browse('${item.path}')` : `load('${item.path}')`}">
                            <i class="fas ${isDir ? 'fa-folder text-yellow-400' : 'fa-file-code text-blue-500'} text-xl"></i>
                            <span class="text-sm font-semibold text-gray-700">${item.name}</span>
                        </div>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="load('${item.path}')" class="p-2 text-xs bg-blue-50 text-blue-600 rounded-lg">Editar</button>
                            <button onclick="drop('${item.path}', '${item.sha}')" class="p-2 text-xs bg-red-50 text-red-600 rounded-lg">Excluir</button>
                        </div>
                    `;
                    list.appendChild(row);
                });
            } catch (e) {
                list.innerHTML = '<div class="p-4 bg-red-50 text-red-500 rounded-xl text-xs text-center">Erro de conexão com o GitHub. Verifique seu Token.</div>';
            }
        }

        async function load(p) {
            const res = await fetch(`https://api.github.com/repos/${_U}/${_R}/contents/${p}`, {
                headers: { 'Authorization': `token ${_T}` }
            });
            const d = await res.json();
            document.getElementById('target-path').value = p;
            document.getElementById('target-body').value = decodeURIComponent(escape(atob(d.content)));
        }

        async function push() {
            const p = document.getElementById('target-path').value;
            const c = document.getElementById('target-body').value;
            if(!p) return alert("Defina o nome do arquivo!");
            
            let s = "";
            try {
                const r = await fetch(`https://api.github.com/repos/${_U}/${_R}/contents/${p}`, { headers: { 'Authorization': `token ${_T}` } });
                if(r.ok) { const d = await r.json(); s = d.sha; }
            } catch(e) {}

            const b = btoa(unescape(encodeURIComponent(c || "TeraGustavo")));
            const res = await fetch(`https://api.github.com/repos/${_U}/${_R}/contents/${p}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${_T}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Cloud Update', content: b, sha: s })
            });

            if(res.ok) { alert("Sincronizado!"); browse(currentFolder); }
            else { alert("Erro ao salvar. O Token pode ter expirado."); }
        }

        async function drop(p, s) {
            if(!confirm("Deletar permanentemente?")) return;
            await fetch(`https://api.github.com/repos/${_U}/${_R}/contents/${p}`, {
                method: 'DELETE',
                headers: { 'Authorization': `token ${_T}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Cloud Delete', sha: s })
            });
            browse(currentFolder);
        }
    </script>
</body>
</html>

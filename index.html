<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraGustavo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; color: white; }
        .v-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; }
        .v-input { background: #1e293b; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        .v-input:focus { border-color: #3b82f6; }
        .f-item { background: #1e293b; transition: 0.2s; border-radius: 8px; border: 1px solid transparent; }
        .f-item:hover { border-color: #3b82f6; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="scr-a" class="fixed inset-0 z-50 flex items-center justify-center bg-[#020617] p-4">
        <div class="v-card p-8 w-full max-w-sm text-center shadow-2xl">
            <i class="fas fa-lock text-slate-600 text-3xl mb-6"></i>
            <h1 class="text-xl font-bold mb-6 tracking-widest text-slate-300">SISTEMA RESTRITO</h1>
            <input type="password" id="k-field" placeholder="Chave de Acesso" class="v-input mb-4 text-center">
            <button onclick="x_check()" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-lg font-bold transition">ENTRAR</button>
            <p id="err" class="text-red-500 text-xs mt-4 hidden">Acesso negado.</p>
        </div>
    </div>

    <div id="scr-b" class="hidden min-h-screen flex-col p-6 max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-slate-800 pb-6">
            <h2 class="text-2xl font-black text-blue-500">TERAGUSTAVO</h2>
            <button onclick="location.reload()" class="text-slate-500 hover:text-red-500"><i class="fas fa-power-off text-xl"></i></button>
        </header>

        <div class="grid lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="v-card p-6">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-4">Gerenciador</h3>
                    <input type="text" id="n-p" placeholder="Caminho/Nome" class="v-input mb-4 text-sm">
                    <textarea id="n-c" rows="5" placeholder="Conteúdo..." class="v-input mb-4 text-xs font-mono"></textarea>
                    <button onclick="x_push()" class="w-full bg-emerald-600 hover:bg-emerald-500 p-3 rounded-lg font-bold text-sm">SALVAR CLOUD</button>
                    <label class="block mt-4 text-center text-xs text-slate-500 cursor-pointer hover:text-white">
                        Importar arquivo local <input type="file" class="hidden" onchange="x_imp(this)">
                    </label>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div id="f-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const _O = 'gustavooliveira178922-debug'; 
        const _R = 'asdadjanasbgfyasfaigaufafnaif'; 
        const _T = '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';
        const _H = "8c66e2c342f5341f237f37435f308f237194639918730438153093259836336e";

        async function x_check() {
            const v = document.getElementById('k-field').value;
            const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
            const r = Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
            if (r === _H) {
                document.getElementById('scr-a').style.display = 'none';
                document.getElementById('scr-b').classList.remove('hidden');
                document.getElementById('scr-b').classList.add('flex');
                x_load();
            } else {
                document.getElementById('err').classList.remove('hidden');
            }
        }

        async function x_load(path = '') {
            const g = document.getElementById('f-grid');
            g.innerHTML = '...';
            const res = await fetch(`https://api.github.com/repos/${_O}/${_R}/contents/${path}`, {
                headers: { 'Authorization': `token ${_T}` }
            });
            const data = await res.json();
            if (!Array.isArray(data)) return;
            g.innerHTML = '';
            data.forEach(i => {
                if (['index.html', '.keep', 'README.md'].includes(i.name)) return;
                const d = document.createElement('div');
                d.className = "f-item p-4 text-center cursor-pointer";
                d.innerHTML = `<i class="fas ${i.type === 'dir' ? 'fa-folder text-amber-500' : 'fa-file text-blue-400'} text-3xl mb-2"></i><p class="text-[10px] truncate">${i.name}</p>`;
                d.onclick = () => i.type === 'dir' ? x_load(i.path) : window.open(i.html_url);
                g.appendChild(d);
            });
        }

        async function x_push() {
            const p = document.getElementById('n-p').value;
            const c = document.getElementById('n-c').value;
            if (!p) return;
            const fp = p.includes('.') ? p : `${p}/.keep`;
            const b64 = btoa(unescape(encodeURIComponent(c || "TeraGustavo Sys")));
            await fetch(`https://api.github.com/repos/${_O}/${_R}/contents/${fp}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${_T}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update`, content: b64 })
            });
            x_load();
            document.getElementById('n-p').value = '';
            document.getElementById('n-c').value = '';
        }

        function x_imp(i) {
            const f = i.files[0];
            const r = new FileReader();
            r.onload = () => { document.getElementById('n-p').value = f.name; document.getElementById('n-c').value = r.result; };
            r.readAsText(f);
        }
    </script>
</body>
</html>
